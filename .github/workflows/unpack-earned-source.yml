name: Unpack Earned Source

on:
  push:
    paths:
      - earned-github-source.zip
      - .github/workflows/unpack-earned-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack source archive
        shell: bash
        run: |
          test -f earned-github-source.zip
          unzip -o earned-github-source.zip
          rm earned-github-source.zip
          rm -f .github/workflows/unpack-earned-source.yml

      - name: Commit unpacked source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Unpack Earned source tree"
          git push
